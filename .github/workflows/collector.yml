name: BTCUSDT Microstructure Collector

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'UTC start date (YYYY-MM-DD)'
        required: true
        default: '2025-01-01'
      end:
        description: 'UTC end date (YYYY-MM-DD)'
        required: true
        default: '2026-05-31'
      source:
        description: 'Primary dataset source'
        required: true
        default: 'hf_features'
        type: choice
        options:
          - hf_features
          - binance_public
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow requests huggingface_hub tqdm python-dateutil

      - name: Run collector
        env:
          START_DATE: ${{ inputs.start || '2025-01-01' }}
          END_DATE: ${{ inputs.end || '2026-05-31' }}
          DATA_SOURCE: ${{ inputs.source || 'hf_features' }}
        run: python collector_http.py

      - name: Build downloadable package
        run: |
          mkdir -p package
          cp -r output/* package/ || true
          cp collector_http.py package/ || true
          cp README.md package/ || true
          zip -r btcusdt-microstructure-research-package.zip package

      - name: Upload research package
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-microstructure-research-${{ github.run_number }}
          path: btcusdt-microstructure-research-package.zip
          retention-days: 14
          compression-level: 0
